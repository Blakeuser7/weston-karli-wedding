<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Watercolor bouquet</title>
  <desc id="desc">Soft peach, blue, ivory, yellow, and green floral bouquet.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="peach" cx="45%" cy="38%">
      <stop offset="0" stop-color="#fff3eb"/>
      <stop offset=".48" stop-color="#efb39b"/>
      <stop offset="1" stop-color="#d98f7b" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="ivory" cx="42%" cy="35%">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset=".55" stop-color="#f4e6cf"/>
      <stop offset="1" stop-color="#d7c4a5" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="blue" cx="45%" cy="38%">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset=".5" stop-color="#aebfdd"/>
      <stop offset="1" stop-color="#718bb7" stop-opacity=".75"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5cba9"/>
      <stop offset="1" stop-color="#738764"/>
    </linearGradient>
  </defs>

  <g opacity=".18" filter="url(#wash)">
    <ellipse cx="360" cy="220" rx="230" ry="90" fill="#eebaa9"/>
    <ellipse cx="420" cy="200" rx="180" ry="75" fill="#bac8df"/>
    <ellipse cx="320" cy="230" rx="180" ry="65" fill="#c4c9a8"/>
  </g>

  <g fill="none" stroke="#718365" stroke-linecap="round">
    <path d="M360 330 C300 260 260 170 210 70" stroke-width="5" opacity=".68"/>
    <path d="M360 330 C430 255 495 165 560 72" stroke-width="5" opacity=".65"/>
    <path d="M360 330 C330 250 340 150 350 45" stroke-width="4" opacity=".58"/>
    <path d="M360 330 C280 275 185 235 95 210" stroke-width="4" opacity=".55"/>
    <path d="M360 330 C440 280 540 245 632 232" stroke-width="4" opacity=".55"/>
  </g>

  <g fill="url(#leaf)" opacity=".86">
    <ellipse cx="212" cy="86" rx="10" ry="22" transform="rotate(-33 212 86)"/>
    <ellipse cx="228" cy="111" rx="10" ry="23" transform="rotate(52 228 111)"/>
    <ellipse cx="245" cy="139" rx="11" ry="24" transform="rotate(-38 245 139)"/>
    <ellipse cx="195" cy="114" rx="9" ry="20" transform="rotate(-53 195 114)"/>
    <ellipse cx="554" cy="92" rx="10" ry="23" transform="rotate(36 554 92)"/>
    <ellipse cx="535" cy="121" rx="10" ry="23" transform="rotate(-53 535 121)"/>
    <ellipse cx="516" cy="149" rx="11" ry="24" transform="rotate(40 516 149)"/>
    <ellipse cx="580" cy="119" rx="9" ry="20" transform="rotate(55 580 119)"/>
    <ellipse cx="349" cy="64" rx="9" ry="22" transform="rotate(-12 349 64)"/>
    <ellipse cx="362" cy="94" rx="10" ry="23" transform="rotate(22 362 94)"/>
    <ellipse cx="118" cy="207" rx="10" ry="23" transform="rotate(-76 118 207)"/>
    <ellipse cx="152" cy="218" rx="10" ry="23" transform="rotate(75 152 218)"/>
    <ellipse cx="604" cy="235" rx="10" ry="23" transform="rotate(73 604 235)"/>
    <ellipse cx="570" cy="244" rx="10" ry="23" transform="rotate(-72 570 244)"/>
  </g>

  <g filter="url(#soft)" opacity=".94">
    <g transform="translate(300 160)">
      <circle r="48" fill="url(#peach)"/>
      <circle cx="-17" cy="-8" r="21" fill="#f8c9b8" opacity=".8"/>
      <circle cx="15" cy="-12" r="19" fill="#f5d0c3" opacity=".72"/>
      <circle cx="4" cy="17" r="17" fill="#e89d87" opacity=".5"/>
