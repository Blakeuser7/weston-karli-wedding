      <circle cx="13" cy="-9" r="15" fill="#e2e9f6" opacity=".75"/>
      <circle cy="13" r="14" fill="#7d96be" opacity=".4"/>
    </g>
    <g transform="translate(470 220)">
      <circle r="36" fill="url(#blue)"/>
      <circle cx="-13" cy="-7" r="15" fill="#d7deef" opacity=".75"/>
      <circle cx="12" cy="-9" r="14" fill="#eef2fb" opacity=".75"/>
      <circle cy="12" r="13" fill="#7d96be" opacity=".4"/>
    </g>
  </g>

  <g fill="#d9b865" opacity=".82">
    <circle cx="280" cy="105" r="6"/>
    <circle cx="292" cy="87" r="5"/>
    <circle cx="306" cy="112" r="5"/>
    <circle cx="444" cy="105" r="6"/>
    <circle cx="459" cy="89" r="5"/>
    <circle cx="470" cy="118" r="5"/>
    <circle cx="190" cy="182" r="5"/>
    <circle cx="174" cy="169" r="4"/>
    <circle cx="525" cy="188" r="5"/>
    <circle cx="542" cy="173" r="4"/>
  </g>

  <g fill="#fffdf8" stroke="#d9c9b1" stroke-width="1" opacity=".95">
    <circle cx="220" cy="165" r="8"/><circle cx="230" cy="157" r="6"/><circle cx="232" cy="170" r="6"/>
    <circle cx="490" cy="165" r="8"/><circle cx="500" cy="157" r="6"/><circle cx="502" cy="170" r="6"/>
    <circle cx="185" cy="235" r="8"/><circle cx="197" cy="229" r="6"/><circle cx="198" cy="242" r="6"/>
    <circle cx="535" cy="245" r="8"/><circle cx="548" cy="239" r="6"/><circle cx="548" cy="251" r="6"/>
  </g>

  <g fill="none" stroke="#7d8f72" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M300 282 C325 310 340 324 360 341"/>
    <path d="M415 280 C395 307 380 325 360 341"/>
  </g>
