      <circle cx="-18" cy="-8" r="23" fill="#fffdf7" opacity=".85"/>
      <circle cx="18" cy="-8" r="21" fill="#f7ead7" opacity=".75"/>
      <circle cx="2" cy="20" r="20" fill="#e9d7bb" opacity=".5"/>
